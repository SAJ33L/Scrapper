[deploy]
cronSchedule = "0 0 * * *"
startCommand = "sh -c 'set -- python scraper.py --output \"${OUTPUT_PATH:-output_prices.xlsx}\" --sites ${SITES:-dmi_ie dmi_uk dentalsky dontalia henryschein} --worksheet \"${WORKSHEET:-BenchmarkingData}\"; if [ \"${FROM_SHEET:-1}\" = \"1\" ]; then set -- \"$@\" --from-sheet --input-worksheet \"${INPUT_WORKSHEET:-InputSheet}\"; else set -- \"$@\" --input \"${INPUT_PATH:-Price Benchmarking - Top 300 April 2025 - Public Website Prices.csv}\"; fi; if [ -n \"${LIMIT:-}\" ]; then set -- \"$@\" --limit \"$LIMIT\"; fi; if [ \"${USE_PLAYWRIGHT:-1}\" = \"1\" ]; then set -- \"$@\" --playwright; fi; if [ \"${NO_SKIP_EXISTING:-0}\" = \"1\" ]; then set -- \"$@\" --no-skip-existing; fi; if [ \"${UPLOAD_TO_SHEETS:-1}\" = \"1\" ]; then set -- \"$@\" --upload-to-sheets; fi; exec \"$@\"'"
